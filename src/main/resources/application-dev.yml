spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
      schema-locations: resources/schema.sql
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        connection:
          characterEncoding: UTF-8
          useUnicode: true
        dialect:
          storage_engine: innodb
        hbm2ddl:
          auto: update
    defer-datasource-initialization: true
  redis:
    repositories:
      enabled: true
      base-package: com.okx.trading.repository.redis
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  messages:
    encoding: UTF-8
  devtools:
    restart:
      enabled: false
      additional-paths: src/main/java
      exclude: static/**,public/**,templates/**
    livereload:
      enabled: true
  thymeleaf:
    cache: false
  freemarker:
    cache: false
  resources:
    static-locations: classpath:/static/
    cache:
      period: 0
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
        debug: ${MAIL_DEBUG:false}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:127.0.0.1}
      port: ${SPRING_REDIS_PORT:6379}
      database: 0
      timeout: 10000

okx:
  api:
    base-url: https://www.okx.com
    api-key: ${OKX_API_KEY:}
    secret-key: ${OKX_SECRET_KEY:}
    passphrase: ${OKX_PASSPHRASE:}
    use-mock-data: ${OKX_MOCK_DATA:false}
    timeout: 30
    connection-mode: WEBSOCKET
    ws:
      public-channel: wss://ws.okx.com:8443/ws/v5/public
      bussiness-channel: wss://ws.okx.com:8443/ws/v5/business
      private-channel: wss://ws.okx.com:8443/ws/v5/private
  proxy:
    https-enable: false
    enabled: false
    host: 192.168.0.39
    port: 19828
  historical-data:
    batch-size: 100
    max-threads: 10
  trading:
    kline:
      max-count: 300
      cleanup-interval: 300
  kline:
    update-interval-seconds: 30

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:}
    url: https://api.deepseek.com/v1/chat/completions

logging:
  level:
    root: INFO
    com.okx.trading: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    okhttp3.OkHttpClient: ERROR
    okhttp3.logging.HttpLoggingInterceptor: ERROR

springfox:
  documentation:
    swagger-ui:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html


#management:

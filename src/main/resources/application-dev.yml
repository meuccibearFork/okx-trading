notification:
  type: ${NOTIFICATION_TYPE:email}
  trade:
    enabled: ${TRADE_NOTIFICATION_ENABLED:true}
  error:
    enabled: ${ERROR_NOTIFICATION_ENABLED:true}
  email:
    enabled: ${EMAIL_NOTIFICATION_ENABLED:true}
    recipient: ${EMAIL_RECIPIENT:}

strategy:
  state:
    email:
      enabled: ${STRATEGY_STATE_EMAIL_ENABLED:true}
      hours: 9,12,15,18,21,0
      show-details: ${STRATEGY_STATE_EMAIL_SHOW_DETAILS:false}
      alert:
        interval: 600000
        frequently: false
  yjw:
    initialStopLoss: ${INITIAL_STOP_LOSS:2}
    incrementPercent: ${INCREMENT_PERCENT:1}

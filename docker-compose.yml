version: '3.2'

services:
  app-vue:
    image: ${PROJECT_IMAGES_PATH}
    container_name: ${PROJECT_IMAGES_NAME}-app-vue
    depends_on:
      - app
    ports:
      - "80:80"
    restart: always

  app:
    image: ${PROJECT_API_IMAGES_PATH}
    container_name: ${PROJECT_IMAGES_NAME}-app
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST:-}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT:-}
      - JAVA_OPTS=-Xmx1g -Xms512m
      - OKX_API_KEY=${OKX_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY:-}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE:-}
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_HOST=${PROXY_HOST:-localhost}
      - PROXY_PORT=${PROXY_PORT:-10809}
    volumes:
      - ./logs:/app/logs
    networks:
      - okx-network

  portainer:
    container_name: portainer
    image: portainer/portainer:latest
    privileged: true
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./cache/portainer:/data:rw
    labels:
      - "general.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

# 已注释MySQL和Redis服务，使用本地服务
  mysql:
    image: mysql:8.0.30
    container_name: okx-trading-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Password123?
      - MYSQL_DATABASE=okx_trading
      - TZ=Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+8:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - okx-network

  redis:
    image: redis:6-alpine
    container_name: okx-trading-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - okx-network

# 网络配置
networks:
  okx-network:
    driver: bridge

# 注释卷配置，因为不再使用Docker中的MySQL和Redis
volumes:
  mysql-data:
  redis-data:

